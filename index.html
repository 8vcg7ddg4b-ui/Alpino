<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SPQR: Herrschaft über Italien</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🦅</text></svg>" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div class="brand">🦅 <span>SPQR</span> <small>Rundenstrategie · 2.5D</small></div>
      <div id="turnLabel" class="pill">Runde 1</div>
      <div id="goldLabel" class="pill">💰 0 Gold</div>
      <button id="endTurnBtn" class="end-turn">Runde beenden ▶</button>
    </header>

    <main id="layout">
      <div id="mapWrap">
        <canvas id="gameCanvas"></canvas>
        <div id="mapHint">Ziehen zum Verschieben der Karte · Pfeiltasten/WASD · Armee anklicken, dann Zielfeld wählen</div>
      </div>

      <aside id="sidebar">
        <section>
          <h2>Fraktionen</h2>
          <ul id="factionList"></ul>
        </section>
        <section id="selectedSection">
          <h2>Auswahl</h2>
          <div id="selectedPanel"><p class="muted">Klicke auf eine Armee oder Stadt, um Details zu sehen.</p></div>
        </section>
        <section id="logSection">
          <h2>Ereignisse</h2>
          <div id="logPanel"></div>
        </section>
      </aside>
    </main>
  </div>

  <div id="gameOverOverlay" class="hidden">
    <div class="overlay-box">
      <h1 class="overlay-title">Sieg</h1>
      <p class="overlay-text"></p>
      <button onclick="location.reload()">Neues Spiel</button>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
